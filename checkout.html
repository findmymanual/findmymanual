<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout Page</title>

  <!-- Paddle JS -->
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>

  <style>
    body, h2, p, label, input, button {
      font-family: Georgia, 'Times New Roman', Times, serif;
    }
    body {
      background-color: #e8edf1;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      color: #080808;
    }
    .order-section {
      background: linear-gradient(to right, #4e6e81, #2c3e50);
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      color: #fff;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }
    .order-section h2 { font-size: 2.2rem; margin-bottom: 25px; font-weight: bold; }
    .order-section form { display: flex; flex-direction: column; gap: 15px; text-align: left; }
    .order-section label { font-weight: bold; margin-bottom: 5px; color: #fff; }
    .order-section input[type="text"],
    .order-section input[type="email"],
    .order-section input[type="tel"] {
      width: 100%; padding: 10px 12px; border-radius: 6px; border: none; font-size: 1rem; color: #33475b; outline: none;
    }
    .order-section input::placeholder { color: #7a7a7a; }
    .order-section button {
      background: #fff; color: #2c3e50; padding: 12px 0; border: none; border-radius: 6px;
      font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.3s ease;
    }
    .order-section button:hover { background: #f5f5f5; }
    .trust-section {
      padding: 25px 20px; border-radius: 12px; text-align: center; margin-top: 20px;
      background: linear-gradient(to right, #4e6e81, #2c3e50); color: #fff;
    }
    .trust-section h2 { font-size: 1.8rem; font-weight: bold; margin-bottom: 15px; }
    .trust-section p { font-size: 1rem; line-height: 1.6; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="order-section">
    <h2>Order Your Manual</h2>
    <form id="orderForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="customer_name" placeholder="Your full name" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="customer_email" placeholder="your.email@example.com" required />

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="customer_phone" placeholder="Phone Number" required />

      <label for="brand">Brand Name</label>
      <input type="text" id="brand" name="brand_name" placeholder="Brand Name" required />

      <label for="model">Serial Number</label>
      <input type="text" id="model" name="model_number" placeholder="Serial Number" required />

      <label for="product">Product Name</label>
      <input type="text" id="product" name="item_name" value="User Manual" readonly />

      <label for="amount">Amount (USD)</label>
      <input type="text" id="amount" name="amount" value="$14.95" readonly />

      <input type="hidden" id="pdf_url" name="pdf_url" value="">

      <button type="submit">Submit Order & Pay</button>

      <h2 style="color:#4e6e81; text-align:center;">
        Checkout for: <span id="productName" style="font-weight:bold;">Loading...</span>
      </h2>

      <div class="trust-section">
  <h2>Secure & Trusted Payment</h2>
  <p>Your payment is 100% secure. We use PayPal, the world's trusted payment system, and all transactions are protected by SSL encryption.</p>
  <div class="logos">
    <img src="https://www.paypalobjects.com/webstatic/mktg/logo/pp_cc_mark_111x69.jpg" alt="PayPal" style="height:50px; width:auto;">
    <img src="mastercard.png" alt="MasterCard" style="height:50px; width:auto;">
    <img src="visa.jpeg" alt="Visa" style="height:50px; width:auto;">
  </div>
</div>
    </form>
  </div>

<script>
  Paddle.Setup({ vendor: 288927 });

  document.addEventListener("DOMContentLoaded", () => {
    // Load product name & PDF from URL
    const params = new URLSearchParams(window.location.search);
    const product = params.get("product");
    const pdf = params.get("pdf");
    if (product) document.getElementById("productName").textContent = decodeURIComponent(product).replace(/_/g, " ");
    if (pdf) document.getElementById("pdf_url").value = pdf;
  });

  document.getElementById("orderForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const orderData = {
      customer_name: document.getElementById("name").value,
      customer_email: document.getElementById("email").value,
      customer_phone: document.getElementById("phone").value,
      brand_name: document.getElementById("brand").value,
      model_number: document.getElementById("model").value,
      item_name: document.getElementById("product").value,
      amount: "$14.95",
      pdf_url: document.getElementById("pdf_url").value,
      payment_status: "pending"
    };

    try {
      // 1️⃣ Submit order to backend to generate order number
      const res = await fetch("https://findmymanual.live/.netlify/functions/submitOrder", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(orderData)
      });
      const result = await res.json();
      const orderNumber = result.order_number; // Backend generates this

      // 2️⃣ Save order number for thank-you page
      localStorage.setItem("lastOrderNumber", orderNumber);

      // 3️⃣ Open Paddle checkout
      Paddle.Checkout.open({
        product: 'pro_01kkrgayxkqtw8v4s8s5yppv1n',
        email: orderData.customer_email,
        passthrough: JSON.stringify({ order_number: orderNumber }),
        successUrl: `thank-you.html?pdf=${encodeURIComponent(orderData.pdf_url)}`
      });

    } catch(err) {
      console.error("Order submission failed:", err);
      alert("There was an error submitting your order. Please try again.");
    }
  });
</script>
</body>
</html>
