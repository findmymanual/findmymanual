<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout Page</title>

<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>

<style>
body, h2, h3, p, label, input, button {
    font-family: Georgia,'Times New Roman',Times,serif;
}

body {
    background:#e8edf1;
    margin:0;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    text-align:center;
}

.order-section {
    background: linear-gradient(to right,#e8edf1,#555);
    border-radius: 12px;
    padding: 30px;
    width: 95%;
    max-width: 700px;
    color: #33475b;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    margin:auto;
    text-align: center;
}

.order-section input {
    width: 95%;
    padding: 12px 15px;
    border-radius: 6px;
    border: none;
    font-size: 1rem;
    color: #555;
    text-align: center;
}

.order-section button {
    background: #555;
    color: #fff;
    padding: 14px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    width: 70%;
    margin-top: 10px;
}

.trusted-box {
    background:#ffffff;
    border:2px solid #555;
    border-radius:10px;
    padding:15px;
    margin-top:15px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,0.15);
}

.trusted-box strong { color:#223d4d; }
.trusted-box small { color:#777; }
.trusted-box p { margin-top:10px; color:#555; font-size:0.95rem; }

.trust-section {
    padding:25px;
    border-radius:12px;
    margin-top:20px;
    background:linear-gradient(to right,#4e6e81,#2c3e50);
    color:#fff;
    text-align:center;
}

.trust-section .logos {
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.trust-section img {
    height:50px;
    background:#fff;
    padding:5px;
    border-radius:6px;
}
</style>
</head>

<body>

<div class="order-section">

    <!-- Header with Manual Name -->
    <div style="background:#fff;border:2px solid #555;border-radius:12px;padding:20px;color:#555;margin-bottom:20px;">
        <h2>Checkout for<br><br><span id="productName">User Manual</span></h2>
    </div>

    <!-- Order Form -->
    <form id="orderForm">

        <label><strong>Order Number</strong></label>
        <div style="background:#fff;border:2px solid #555;border-radius:12px;padding:12px;">
            <input type="text" id="order_number" readonly>
        </div><br>

        <label><strong>Full Name</strong></label>
        <div style="background:#fff;border:2px solid #555;border-radius:12px;padding:12px;">
            <input type="text" id="name" required>
        </div><br>

        <label><strong>Email</strong></label>
        <div style="background:#fff;border:2px solid #555;border-radius:12px;padding:12px;">
            <input type="email" id="email" required>
        </div><br>

        <label><strong>Phone Number</strong></label>
        <div style="background:#fff;border:2px solid #555;border-radius:12px;padding:12px;">
            <input type="tel" id="phone" required>
        </div><br>

        <label><strong>Brand Name</strong></label>
        <div style="background:#fff;border:2px solid #555;border-radius:12px;padding:12px;">
            <input type="text" id="brand" required>
        </div><br>

        <label><strong>Serial Number</strong></label>
        <div style="background:#fff;border:2px solid #555;border-radius:12px;padding:12px;">
            <input type="text" id="model" required>
        </div><br>

        <label><strong>Amount</strong></label>
        <div style="background:#fff;border:2px solid #555;border-radius:12px;padding:12px;">
            <input type="text" id="amount" value="$14.95" readonly>
        </div><br>

        <input type="hidden" id="pdf_url">

        <button type="submit">Pay Now</button>
    </form>

    <!-- Trusted Box -->
    <div class="trusted-box">
        <strong>Trusted Checkout</strong><br>
        <small>100% Safe & Protected</small>
        <p>🔒 Your payment is protected by SSL encryption. We never store your full card details.</p>
    </div>

    <!-- Payment Logos -->
    <div class="trust-section">
        <h2>Secure Payment</h2>
        <p>We accept major payment methods supported by our processor.</p>
        <div class="logos">
            <img src="mastercard.png">
            <img src="visa.jpeg">
            <img src="paypal.webp">
        </div>
    </div>

</div>

<script>
// GET MANUAL FROM URL
const params = new URLSearchParams(window.location.search);
const manual = params.get("manual");
const pdfLink = "https://pub-0c35548c48644ff38f704717a8222bd7.r2.dev/" + manual;

// DISPLAY MANUAL NAME
if(manual){
    let fileName = manual.split('/').pop();
    fileName = decodeURIComponent(fileName);
    fileName = fileName.replace(".pdf","");
    document.getElementById("productName").textContent = fileName;
}

// GENERATE ORDER NUMBER
function generateOrderNumber() {
    return Math.floor(100000 + Math.random() * 900000);
}
document.getElementById("order_number").value = generateOrderNumber();

// SAVE PDF LINK
document.getElementById("pdf_url").value = pdfLink;

// HANDLE FORM SUBMIT
document.getElementById("orderForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = {
        order_number: document.getElementById("order_number").value,
        customer_name: document.getElementById("name").value,
        customer_email: document.getElementById("email").value,
        customer_phone: document.getElementById("phone").value,
        brand_name: document.getElementById("brand").value,
        model_number: document.getElementById("model").value,
        pdf_url: pdfLink,
        amount: "$14.95",
        payment_status: "pending"
    };

    try {
        // Send to Formspree
        await fetch("https://formspree.io/f/xldpwdpb", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        });

        // Send to Netlify backend
        await fetch("https://findmymanual.live/.netlify/functions/submitOrder", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        });

        // OPEN PADDLE CHECKOUT
        Paddle.Checkout.open({
            product: 'pro_01kkrgayxkqtw8v4s8s5yppv1n', // your real product ID
            successUrl: pdfLink
        });

    } catch(err) {
        alert("Error submitting order. Please try again.");
        console.error(err);
    }
});
</script>

</body>
</html>
