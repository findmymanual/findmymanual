<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout Page</title>

<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>

<style>
body,h2,p,label,input,button{
  font-family:Georgia,'Times New Roman',Times,serif;
}
body{
  background-color:#e8edf1;
  margin:0;
  padding:20px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
  color:#080808;
}
.order-section{
  background:linear-gradient(to right,#4e6e81,#2c3e50);
  border-radius:12px;
  padding:30px;
  width:100%;
  max-width:400px;
  color:#fff;
  text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,0.2);
}
.order-section h2{
  font-size:2.2rem;
  margin-bottom:25px;
  font-weight:bold;
}
.order-section label{
  font-weight:bold;
  margin-bottom:5px;
  color:#fff;
  display:block;
  text-align:left;
}
.order-section input[type="text"],
.order-section input[type="email"],
.order-section input[type="tel"]{
  width:100%;
  padding:10px 12px;
  border-radius:6px;
  border:none;
  font-size:1rem;
  color:#33475b;
  outline:none;
  margin-bottom:15px;
}
.order-section input[readonly]{
  background-color:#d1d5db;
  cursor:not-allowed;
}
.order-section button{
  background:#fff;
  color:#2c3e50;
  padding:12px 0;
  border:none;
  border-radius:6px;
  font-size:1rem;
  font-weight:bold;
  cursor:pointer;
  transition:background 0.3s ease;
  width:100%;
}
.order-section button:hover{
  background:#f5f5f5;
}
.trust-section{
  padding:25px 20px;
  border-radius:12px;
  text-align:center;
  margin-top:20px;
  background:linear-gradient(to right,#4e6e81,#2c3e50);
  color:#fff;
}
.trust-section h2{
  font-size:1.8rem;
  font-weight:bold;
  margin-bottom:15px;
}
.trust-section p{
  font-size:1rem;
  line-height:1.6;
  margin-bottom:20px;
}
.trust-section .logos{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}
.trust-section .logos img{
  height:30px;
  width:auto;
}
</style>

</head>

<body>

<div class="order-section">

<h2>Order Your Manual</h2>

<label>Full Name</label>
<input type="text" id="name" placeholder="Your full name">

<label>Email</label>
<input type="email" id="email" placeholder="your.email@example.com">

<label>Phone Number</label>
<input type="tel" id="phone" placeholder="Phone Number">

<label>Brand Name</label>
<input type="text" id="brand" placeholder="Brand Name">

<label>Serial Number</label>
<input type="text" id="model" placeholder="Serial Number">

<label>Product Name</label>
<input type="text" value="User Manual" readonly>

<label>Amount (USD)</label>
<input type="text" value="$14.95" readonly>

<button id="payButton">Submit Order & Pay</button>

<div class="trust-section">

<h2>Secure & Trusted Payment</h2>
<p>Your payment is 100% secure. We use Paddle, a trusted global payment processor.</p>

<div class="logos">
<img src="https://www.paypalobjects.com/webstatic/mktg/logo/pp_cc_mark_111x69.jpg" alt="PayPal">
<img src="mastercard.png" alt="MasterCard">
<img src="visa.jpeg" alt="Visa">
</div>

</div>
</div>

<script>
// Initialize Paddle with your LIVE client token
Paddle.Initialize({
  token: "live_7fd8fb2221b2b9ec5b3320c704e"
});

document.getElementById("payButton").addEventListener("click", function() {

  // Collect form values
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const brand = document.getElementById("brand").value.trim();
  const model = document.getElementById("model").value.trim();

  // Validate fields
  if(!name || !email || !phone || !brand || !model){
    alert("Please fill out all required fields.");
    return;
  }

  // Generate a temporary order number
  const order_number = Math.floor(100000 + Math.random() * 900000).toString();

  // Pass customer info to Paddle via customData
  const customData = {
    name: name,
    email: email,
    phone: phone,
    brand: brand,
    model: model,
    order_number: order_number,
    product: "User Manual",
    amount: "$14.95"
  };

  // Open Paddle Checkout
  Paddle.Checkout.open({
    items: [
      { priceId: "pri_01kkrgrb89fvnyhdrd1x0g8fsa", quantity: 1 }
    ],
    customer: {
      email: email
    },
    customData: customData,
    successUrl: "thank-you.html"
  });

});
</script>

</body>
</html>
