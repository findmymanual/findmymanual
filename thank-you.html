  <script>
window.dataLayer = window.dataLayer || [];
function gtag(){ dataLayer.push(arguments); }

gtag('js', new Date());
gtag('config', 'AW-17308900859');

/* ==============================
   RELIABLE PURCHASE TRACKING
============================== */
function firePurchase() {

  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('order');

  if (!orderId) return;

  const key = "conv_" + orderId;

  if (sessionStorage.getItem(key)) return;

  gtag('event', 'purchase', {
    'send_to': 'AW-17308900859/5zzyCKLvkqwbEPu7w71A',
    'transaction_id': orderId,
    'value': 14.95,
    'currency': 'USD'
  });

  sessionStorage.setItem(key, 'true');
}

/* Fire only when page is fully ready */
window.addEventListener("load", firePurchase, { once: true });

  </script>
