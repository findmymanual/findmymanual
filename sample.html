<div id="trust-banner">
  <span id="trust-text"></span>
</div>

<style>
#trust-banner {
  position: fixed;
  top: 0;
  width: 100%;
  background: #0f172a;
  color: #fff;
  text-align: center;
  padding: 10px;
  font-size: 14px;
  z-index: 9999;
}
body {
  margin-top: 40px;
}
</style>

<script>
const messages = [
  "✔ 1,284 manuals delivered this week",
  "✔ Last order: Samsung Washer (2 mins ago)",
  "✔ Last order: LG Refrigerator (5 mins ago)",
  "✔ Last order: Whirlpool Dryer (8 mins ago)",
  "✔ 27 people downloaded manuals today",
  "✔ Instant download available after checkout"
];

let index = 0;

function rotateMessage() {
  document.getElementById("trust-text").innerText = messages[index];
  index = (index + 1) % messages.length;
}

setInterval(rotateMessage, 3000); // change every 3 sec
rotateMessage();
</script>
