<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Find My Manual</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f7fa;
    color:#2c3e50;
}

.search-section{
    max-width:900px;
    margin:100px auto;
    text-align:center;
    padding:40px 20px;
}

.search-section h1{
    font-size:48px;
    margin-bottom:15px;
    color:#2c3e50;
}

.search-section p{
    font-size:20px;
    color:#666;
    margin-bottom:35px;
}

.search-box{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.search-box input{
    width:650px;
    max-width:100%;
    padding:20px;
    font-size:20px;
    border:2px solid #d9d9d9;
    border-radius:10px;
    outline:none;
    transition:.3s;
}

.search-box input:focus{
    border-color:#4e6e81;
    box-shadow:0 0 10px rgba(78,110,129,.2);
}

.search-box button{
    background:#4e6e81;
    color:white;
    border:none;
    padding:20px 40px;
    font-size:20px;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
}

.search-box button:hover{
    background:#2c3e50;
}

@media(max-width:768px){

.search-section h1{
    font-size:34px;
}

.search-section p{
    font-size:18px;
}

.search-box{
    flex-direction:column;
}

.search-box input{
    width:100%;
}

.search-box button{
    width:100%;
}
}
</style>

</head>
<body>

<section class="search-section">

<h1>Find Your Manual</h1>

<p>Search by brand or model number.</p>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search by brand or model (e.g. Samsung RF28T5101)"
>

<button onclick="searchManual()">
Find Manual
</button>

</div>

</section>

<script>

function searchManual(){

let query=document.getElementById("searchInput").value.trim();

if(query===""){
alert("Please enter a brand or model number.");
return;
}

alert("You searched for: "+query);

// We'll replace this later with real search results.

}

</script>

</body>
</html>
