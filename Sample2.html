<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Find My Manual</title>

<style>

body{
font-family:Arial;
background:#f5f7fa;
}

.container{

width:800px;
max-width:95%;
margin:80px auto;
text-align:center;

}

h1{

font-size:48px;
margin-bottom:10px;

}

.subtitle{

font-size:20px;
margin-bottom:30px;
color:#666;

}

.search-wrapper{

position:relative;

}

#search{

width:100%;
padding:18px;
font-size:18px;
border:2px solid #ddd;
border-radius:8px;

}

#results{

position:absolute;
width:100%;
background:white;
border:1px solid #ddd;
border-top:none;
max-height:350px;
overflow-y:auto;
display:none;
z-index:100;

}

.result{

padding:15px;
cursor:pointer;
text-align:left;
border-bottom:1px solid #eee;

}

.result:hover{

background:#f3f3f3;

}

.brand{

font-weight:bold;

}

.model{

color:#777;

}

</style>

</head>

<body>

<div class="container">

<h1>Find Your Manual</h1>

<p class="subtitle">
Search by brand or model number.
</p>

<div class="search-wrapper">

<input

id="search"

type="text"

placeholder="Search by brand or model (e.g. Samsung RF28T5101)"

autocomplete="off"

>

<div id="results"></div>

</div>

</div>

<script src="manuals.js"></script>

<script>

const input=document.getElementById("search");

const results=document.getElementById("results");

input.addEventListener("keyup",function(){

const keyword=this.value.toLowerCase().trim();

results.innerHTML="";

if(keyword.length==0){

results.style.display="none";

return;

}

const matches=manuals.filter(item=>{

return item.brand.toLowerCase().includes(keyword)

||

item.model.toLowerCase().includes(keyword)

||

item.title.toLowerCase().includes(keyword);

});

if(matches.length==0){

results.innerHTML="<div class='result'>No manuals found.</div>";

results.style.display="block";

return;

}

matches.slice(0,20).forEach(item=>{

results.innerHTML+=`

<div class="result"

onclick="window.location='${item.url}'">

<div class="brand">${item.title}</div>

<div class="model">${item.model}</div>

</div>

`;

});

results.style.display="block";

});

document.addEventListener("click",function(e){

if(!e.target.closest(".search-wrapper")){

results.style.display="none";

}

});

</script>

</body>

</html>
