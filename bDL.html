<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find My Manual - HP Manuals</title>

<style>
/* PDF Grid Layout */
.pdf-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    justify-items: center;
    padding: 20px 0;
}
@media (max-width: 1024px) { .pdf-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 768px) { .pdf-grid { grid-template-columns: repeat(2, 1fr); } }

.pdf-box {
    background:#f5f5f5;
    border:2px solid #4e6e81;
    border-radius:10px;
    padding:20px;
    text-align:center;
    width:100%;
    max-width:250px;
}
.pdf-box h3 { font-size:1rem; color:#4e6e81; margin-bottom:10px; }
.pdf-box a.pdf-btn {
    text-decoration:none;
    color:#fff;
    background:#4e6e81;
    padding:10px 15px;
    border-radius:6px;
    display:inline-block;
    font-weight:bold;
    transition: background 0.3s ease;
}
.pdf-box a.pdf-btn:hover { background:#2c3e50; }

#pdfSearch {
    width:100%;
    max-width:400px;
    padding:12px 16px;
    margin:20px auto;
    display:block;
    font-size:1rem;
    border:2px solid #4e6e81;
    border-radius:8px;
    outline:none;
}
</style>
</head>
<body>

<section style="max-width: 1200px; margin: 40px auto; padding: 20px;">

<h2 style="color: #4e6e81; font-size: 1.8rem; text-align:center;">
    Available HP PDF Manuals
</h2>

<h2 style="font-size:2rem; color:#ffffff; display:inline-block; padding:12px 30px;
background:#4e6e81; border-radius:16px; margin-bottom:30px; position:relative;
left:50%; transform:translateX(-50%);">
Download Now!
</h2>

<!-- SEARCH BAR -->
<input type="text" id="pdfSearch" placeholder="Search model number...">

<!-- MANUAL REQUEST BUTTON -->
<div style="text-align:center; margin-top:10px; margin-bottom:20px;">
<a href="checkout.html"
style="background:#4e6e81; color:#fff; padding:14px 28px; text-decoration:none;
border-radius:6px; font-size:1.1rem; font-weight:700; display:inline-block;">
Can't find your manual? Click here and send us the Brand + Model
</a>
</div>

<!-- PDF BOXES -->
<div class="pdf-grid">
    <div class="pdf-box">
        <h3><strong>Brother<br>1334D<br>Sewing Machine</strong></h3>
        <a href="https://pub-9146209e287d4fb7ae13d2b13875df0a.r2.dev/Brother1/Brother%201334D%20Sewing%20Machine.pdf"
           class="pdf-btn">Download PDF</a>
    </div>

    <!-- Add more PDF boxes here -->
</div>

</section>

<!-- FOOTER -->
<footer style="text-align:center; margin-top:40px;">
<div style="margin-bottom:20px;">
  <p><a href="index.html" style="color:#4e6e81; font-weight:bold;">← Back to Homepage</a></p>
</div>
<div style="margin-top:20px;">
  <a href="privacy.html" target="_blank" style="color:#4e6e81; font-weight:bold; margin:0 10px;">Privacy Policy</a> |
  <a href="terms.html" target="_blank" style="color:#4e6e81; font-weight:bold; margin:0 10px;">Terms and Conditions</a> |
  <a href="about.html" target="_blank" style="color:#4e6e81; font-weight:bold; margin:0 10px;">About Us</a>
</div>
<div style="margin-top:30px; font-size:0.9rem; color:#4e6e81; padding-top:20px;">
© 2025 Find My Manual. All rights reserved.
</div>
</footer>

<script>
// SEARCH FUNCTION
document.addEventListener("DOMContentLoaded", () => {
    const search = document.getElementById("pdfSearch");
    const boxes = document.querySelectorAll(".pdf-box");

    search.addEventListener("input", function () {
        const q = this.value.toLowerCase().trim();
        boxes.forEach(box => {
            const text = box.textContent.toLowerCase();
            box.style.display = text.includes(q) ? "block" : "none";
        });
    });

    // AUTOMATIC PDF LINK REWRITE TO CHECKOUT
    boxes.forEach(box => {
        const link = box.querySelector("a.pdf-btn");
        if (!link) return;

        const fileUrl = link.href;
        const fileName = fileUrl.split("/").pop().replace(".pdf", "");
        const productName = encodeURIComponent(fileName);

        // Update link to checkout
        const checkoutUrl = `/checkout.html?product=${productName}&pdf=${encodeURIComponent(fileUrl)}`;
        link.href = checkoutUrl;

        // Intercept click to redirect
        link.addEventListener("click", function(e) {
            e.preventDefault();
            window.location.href = checkoutUrl;
        });
    });
});
</script>

</body>
</html>
