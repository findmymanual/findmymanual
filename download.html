<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Download is Ready</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background: #f5f5f5;
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 400px;
      margin: auto;
      border: 2px solid #4e6e81;
    }
    h2 {
      color: #4e6e81;
    }
    .small {
      font-size: 14px;
      color: #555;
      margin-top: 10px;
    }
    .download-btn {
      display: inline-block;
      background: #4e6e81;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 10px;
    }
    .download-btn:hover {
      background: #5f879a;
    }
  </style>

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1424202759904253"
     crossorigin="anonymous"></script>
</head>
<body>

<div class="box">
  <h2>Redirecting you now…</h2>
  <p class="small">Please wait while we prepare your file.</p>

  <!-- AdSense Ad -->
  <ins class="adsbygoogle"
       style="display:block; text-align:center;"
       data-ad-client="ca-pub-1424202759904253"
       data-ad-slot="5235434866"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>
    (adsbygoogle = window.adsbygoogle || []).push({});
  </script>

  <p class="small">If the download doesn’t start automatically, <a id="manualLink" href="#" class="download-btn">click here</a>.</p>
</div>

<script>
  // Get file URL from query string
  const urlParams = new URLSearchParams(window.location.search);
  const fileURL = urlParams.get("url");

  if (fileURL) {
    const manualLink = document.getElementById("manualLink");
    manualLink.href = fileURL;

    // Auto-download after 5 seconds (enough for AdSense to load)
    setTimeout(() => {
      window.location.href = fileURL;
    }, 5000);
  } else {
    document.querySelector("h2").textContent = "Download link missing!";
  }
</script>

</body>
</html>
